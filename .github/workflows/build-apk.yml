name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Project & Sync Capacitor
        run: |
          npm install
          npm run build

          mkdir -p dist/client
          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist/client/
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Verify Android startup configuration
        run: |
          node -e "const fs = require('fs'); const config = JSON.parse(fs.readFileSync('android/app/src/main/assets/capacitor.config.json', 'utf8')); if (!config.server?.url?.startsWith('https://')) throw new Error('APK startup requires capacitor.config.ts server.url to use HTTPS'); console.log('Android startup URL:', config.server.url);"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
