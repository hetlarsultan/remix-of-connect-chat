name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Project & Fix Directories
        run: |
          npm install
          npm run build
          
          # إنشاء مسار المجلد المطلوب بالضبط وتصدير الملفات إليه
          mkdir -p dist/client
          if [ -d "dist" ] && [ "$(ls -A dist)" != "client" ]; then
            cp -r dist/* dist/client/ || true
          fi
          
          # إزالة مجلد أندرويد القديم إن وجد لضمان مزامنة نظيفة بدون أخطاء
          rm -rf android
          
          # إضافة منصة أندرويد والمزامنة
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
