name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Project & Prepare Capacitor
        run: |
          npm install
          npm run build
          
          # إنشاء مجلد dist/client ونقل ملفات البناء إليه بدقة
          mkdir -p dist/client
          if [ -d "dist/client/client" ]; then
            rm -rf dist/client/client
          fi
          
          # نسخ محتويات مجلد dist (أو public إن وجدت) لضمان وجود index.html
          if [ -d "dist" ]; then
            cp -r dist/* dist/client/ 2>/dev/null || true
          fi
          
          # تنظيف مجلد أندرويد القديم وإعادة إنشائه بنظافة تامة
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
