name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Project & Fix Web Assets
        run: |
          npm install
          npm run build
          
          # التأكد من إنشاء مجلد dist/client ونقل ملفات الoutput أو dist إليه
          mkdir -p dist/client
          
          # إذا وُجد مجلد .output/public (خاص بـ Nitro/TanStack)، ننقل محتوياته لـ dist/client لضمان وجود index.html
          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist/client/
          elif [ -d "dist" ]; then
            cp -r dist/* dist/client/ 2>/dev/null || true
          fi
          
          # تنظيف أي مجلد أندرويد قديم وإعادة إنشائه
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
