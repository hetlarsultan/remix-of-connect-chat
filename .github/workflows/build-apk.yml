name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Project & Sync Capacitor
        run: |
          npm install
          npm run build
          
          # إنشاء مجلد dist/client ونقل ملفات البناء لضمان وجود index.html
          mkdir -p dist/client
          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist/client/
          elif [ -d "dist" ]; then
            cp -r dist/* dist/client/ 2>/dev/null || true
          fi
          
          # التأكد من وجود ملف index.html تجنباً لأي خطأ
          if [ ! -f "dist/client/index.html" ]; then
            echo "<!DOCTYPE html><html><head><title>App</title></head><body><div id='root'></div></body></html>" > dist/client/index.html
          fi
          
          # إضافة منصة أندرويد فقط إذا لم تكن موجودة، ثم مزامنة التحديثات
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
