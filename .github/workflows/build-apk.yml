name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Project & Sync Capacitor
        env:
          CAPACITOR_BUILD: '1'
        run: |
          npm install
          npm run build

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Verify bundled Android web files
        run: |
          test -s dist/client/index.html || { echo "dist/client/index.html is missing"; exit 1; }
          ls dist/client/assets/*.js > /dev/null || { echo "dist/client/assets has no JS"; exit 1; }
          ASSETS=android/app/src/main/assets
          test -s $ASSETS/public/index.html || { echo "index.html was not copied into the APK"; exit 1; }
          grep -q '/assets/' $ASSETS/public/index.html || { echo "index.html does not load the app scripts"; exit 1; }
          node -e "const c = JSON.parse(require('fs').readFileSync('$ASSETS/capacitor.config.json','utf8')); if (c.server && c.server.url) throw new Error('server.url must not be set; the APK runs from bundled files'); console.log('Android runs bundled files, scheme:', c.server && c.server.androidScheme);"
          grep -q 'ca-app-pub-8449241346087567~3470418204' android/app/src/main/res/values/strings.xml || { echo "AdMob App ID missing"; exit 1; }

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
